<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIB parts</title>
<!-- Generated by `libkit build` (copied from tools/libkit/review_page.html). Read-only, offline:
     data.js (build) and check.js (libkit check) set window.LIB_DATA / window.LIB_CHECK. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5fd0; --hover: #f0f2f8; --sel: #e3e9fb;
  --ok-bg: #e3f3e6; --ok: #1f6b33; --info-bg: #e4ecfb; --info: #2448a0;
  --warn-bg: #fbf0d9; --warn: #8a5a00; --bad-bg: #fbe3e1; --bad: #a3261b; --grey-bg: #ecebe7;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161716; --panel: #1f201f; --text: #e8e7e3; --muted: #9b9a94; --line: #343532;
    --accent: #8fb0ff; --hover: #262a33; --sel: #2c3550;
    --ok-bg: #1c3323; --ok: #8fd6a0; --info-bg: #1f2b45; --info: #a9c1ff;
    --warn-bg: #3a2f17; --warn: #f0c56b; --bad-bg: #42201d; --bad: #ff9c90; --grey-bg: #2a2b29;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px 6px; }
header h1 { font-size: 18px; margin: 0; }
.muted { color: var(--muted); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--grey-bg); color: var(--muted); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.notes { width: 100%; margin: 0; padding-left: 18px; color: var(--warn); font-size: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 16px 10px; }
.toolbar > * { min-width: 0; }
#q { flex: 1 1 260px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); font: inherit; }
#q:focus, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
button { border-radius: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip .n { opacity: .7; margin-left: 4px; }
.colwrap { position: relative; }
#colmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.15); white-space: nowrap; }
#colmenu label { display: block; padding: 2px 0; cursor: pointer; }
main { flex: 1; min-height: 0; display: flex; gap: 0; border-top: 1px solid var(--line); }
.tablewrap { flex: 1; min-width: 0; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--bg); cursor: pointer; user-select: none; font-weight: 600; z-index: 1; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--mono); font-size: 12px; }
td.wrap { white-space: normal; min-width: 240px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr[aria-selected="true"] { background: var(--sel); }
tr.deprecated td { color: var(--muted); }
.tag { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; background: var(--grey-bg); }
.tag.Basic { background: var(--ok-bg); color: var(--ok); }
.tag.Preferred { background: var(--info-bg); color: var(--info); }
.tag.Extended { background: var(--warn-bg); color: var(--warn); }
.tag.dep { background: var(--bad-bg); color: var(--bad); }
.stock-out { color: var(--bad); font-weight: 600; }
.stock-low { color: var(--warn); font-weight: 600; }
.mark-err { color: var(--bad); }
.mark-warn { color: var(--warn); }
aside { width: 440px; flex: none; overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px 24px; }
aside h2 { font-size: 17px; margin: 0 0 2px; word-break: break-all; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
.previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.card { background: #ffffff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; min-height: 120px;
  display: flex; align-items: center; justify-content: center; }
.card img { width: 100%; height: 200px; object-fit: contain; }
.card .none { color: #77766f; font-size: 12px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.issues { margin: 0; padding-left: 18px; font-size: 13px; }
.issues li.error { color: var(--bad); }
.issues li.warning { color: var(--warn); }
.links { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
a { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 16px; }
@media (max-width: 900px) {
  body { display: block; height: auto; }
  main { display: block; }
  .tablewrap { max-height: 60vh; }
  .chips { flex: 1 1 100%; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>LIB parts</h1>
  <span id="count" class="muted"></span>
  <span id="built" class="muted"></span>
  <span id="checkpill" class="pill">not checked</span>
  <ul id="notes" class="notes" hidden></ul>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search name, value, MPN, LCSC, parameters…  ( / )" autocomplete="off" aria-label="Search">
  <div id="chips" class="chips" role="group" aria-label="Categories"></div>
  <div class="colwrap">
    <button id="colbtn" type="button" aria-expanded="false" aria-controls="colmenu">Columns</button>
    <div id="colmenu" hidden></div>
  </div>
</div>
<main>
  <div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
    <div id="empty" class="empty" hidden>No parts match.</div></div>
  <aside id="detail"><p class="muted">Select a part to see its symbol, footprint, fields and check results.</p></aside>
</main>
<script src="data.js"></script>
<script src="check.js"></script>
<script>
"use strict";
(function () {
  var DATA = window.LIB_DATA || { parts: [], categories: [], notes: ["data.js missing: run libkit build"] };
  var CHECK = window.LIB_CHECK || null;
  var STALE = !!(CHECK && CHECK.hash !== DATA.hash);
  var catTitle = {};
  DATA.categories.forEach(function (c) { catTitle[c.key] = c.title; });

  // ---- small DOM helper: text only, never HTML ----
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "text") e.textContent = props[k];
      else if (k === "cls") e.className = props[k];
      else if (k === "on") Object.keys(props.on).forEach(function (ev) { e.addEventListener(ev, props.on[ev]); });
      else e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function store(key, val) {
    try { if (val === undefined) return window.localStorage.getItem(key); window.localStorage.setItem(key, val); }
    catch (e) { return null; }
    return null;
  }
  function relUrl(path) { return path.split("/").map(encodeURIComponent).join("/"); }

  // ---- check results ----
  function checkIssues(name) { return (CHECK && CHECK.parts && CHECK.parts[name]) || []; }
  // Stale check results never mark rows; the detail panel lists them separately, labelled stale.
  function allIssues(p) { return STALE ? p.issues : p.issues.concat(checkIssues(p.name)); }
  (function pill() {
    var pillEl = document.getElementById("checkpill");
    if (!CHECK) { pillEl.textContent = "not checked — run libkit check"; return; }
    var when = (CHECK.time || "").replace("T", " ").slice(0, 16);
    if (STALE) { pillEl.textContent = "check results are older than the data (" + when + ")"; return; }
    pillEl.textContent = CHECK.errors ? "check: " + CHECK.errors + " errors, " + CHECK.warnings + " warnings · " + when
      : "check ✓ 0 errors" + (CHECK.warnings ? ", " + CHECK.warnings + " warnings" : "") + (CHECK.klc ? " · KLC" : " · no KLC") + " · " + when;
    pillEl.className = "pill " + (CHECK.errors ? "bad" : "ok");
  })();
  (function notes() {
    var list = (DATA.notes || []).concat(CHECK && !STALE ? (CHECK.library || []).map(function (i) { return i.severity + ": " + i.message; }) : []);
    var ul = document.getElementById("notes");
    list.forEach(function (n) { ul.appendChild(el("li", { text: n })); });
    ul.hidden = !list.length;
    document.getElementById("built").textContent = DATA.built ? "built " + DATA.built.replace("T", " ").slice(0, 16) : "";
  })();

  // ---- columns ----
  function stockCell(p) {
    if (p.stock == null) return el("td", { cls: "num muted", text: "—" });
    var cls = p.stock === 0 ? "num stock-out" : p.stock < p.stock_low ? "num stock-low" : "num";
    return el("td", { cls: cls, text: p.stock.toLocaleString("en-US"), title: p.stock_checked ? "checked " + p.stock_checked : "" });
  }
  var COLS = [
    { id: "mark", label: "", fixed: true, get: function (p) {
        var iss = allIssues(p), e = iss.some(function (i) { return i.severity === "error"; });
        return iss.length ? (e ? 2 : 1) : 0; },
      cell: function (p, v) { return el("td", { cls: v === 2 ? "mark-err" : "mark-warn", text: v === 2 ? "●" : v ? "▲" : "", title: v ? allIssues(p).length + " check result(s)" : "" }); } },
    { id: "name", label: "Name", def: true, mono: true },
    { id: "value", label: "Value", def: true },
    { id: "package", label: "Package", def: true },
    { id: "params", label: "Params", def: true, get: function (p) { return p.params.map(function (x) { return x[1]; }).join(" · "); } },
    { id: "manufacturer", label: "Manufacturer", def: true },
    { id: "mpn", label: "MPN", def: true, mono: true },
    { id: "lcsc", label: "LCSC", def: true, mono: true },
    { id: "jlc_type", label: "JLC", def: true, cell: function (p) { return el("td", {}, [p.jlc_type ? el("span", { cls: "tag " + p.jlc_type, text: p.jlc_type }) : null]); } },
    { id: "stock", label: "Stock", def: true, num: true, get: function (p) { return p.stock == null ? -1 : p.stock; }, cell: stockCell },
    { id: "category", label: "Category", get: function (p) { return catTitle[p.category] || p.category; } },
    { id: "description", label: "Description", wrap: true },
    { id: "footprint", label: "Footprint", mono: true },
    { id: "symbol", label: "Symbol", mono: true },
    { id: "status", label: "Status", cell: function (p) { return el("td", {}, [p.status === "deprecated" ? el("span", { cls: "tag dep", text: "deprecated" }) : p.status]); } },
    { id: "datasheet_lang", label: "DS lang" },
    { id: "stock_checked", label: "Stock checked" }
  ];
  COLS.forEach(function (c) { if (!c.get) c.get = function (p) { return p[c.id] || ""; }; });
  var shown = {};
  (function loadCols() {
    var saved = null;
    try { saved = JSON.parse(store("lib.columns") || "null"); } catch (e) { saved = null; }
    COLS.forEach(function (c) { shown[c.id] = c.fixed || (Array.isArray(saved) ? saved.indexOf(c.id) >= 0 : !!c.def); });
  })();
  function saveCols() { store("lib.columns", JSON.stringify(COLS.filter(function (c) { return !c.fixed && shown[c.id]; }).map(function (c) { return c.id; }))); }

  // ---- filter, sort, render ----
  var q = document.getElementById("q"), sort = { id: null, dir: 1 }, cats = {}, selected = null;
  DATA.parts.forEach(function (p) {
    p._hay = [p.name, p.keywords, catTitle[p.category] || "", p.footprint, p.symbol, p.description]
      .concat(p.fields.map(function (f) { return f[1]; })).join(" ").toLowerCase();
  });
  function visible() {
    var terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    var anyCat = Object.keys(cats).some(function (k) { return cats[k]; });
    var list = DATA.parts.filter(function (p) {
      if (anyCat && !cats[p.category]) return false;
      return terms.every(function (t) { return p._hay.indexOf(t) >= 0; });
    });
    if (sort.id) {
      var col = COLS.filter(function (c) { return c.id === sort.id; })[0];
      list.sort(function (a, b) {
        var x = col.get(a), y = col.get(b);
        var r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "en", { numeric: true });
        return r * sort.dir || a.name.localeCompare(b.name);
      });
    }
    return list;
  }
  function renderHead() {
    var tr = document.getElementById("head");
    tr.textContent = "";
    COLS.forEach(function (c) {
      if (!shown[c.id]) return;
      var th = el("th", { cls: c.num ? "num" : "", text: c.label, scope: "col" });
      if (sort.id === c.id) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
      th.addEventListener("click", function () {
        sort = { id: c.id, dir: sort.id === c.id ? -sort.dir : (c.num ? -1 : 1) };
        renderHead(); renderRows();
      });
      tr.appendChild(th);
    });
  }
  function renderRows() {
    var list = visible(), body = document.getElementById("rows"), frag = document.createDocumentFragment();
    list.forEach(function (p) {
      var tr = el("tr", { cls: p.status === "deprecated" ? "deprecated" : "", "aria-selected": String(p === selected) });
      COLS.forEach(function (c) {
        if (!shown[c.id]) return;
        var v = c.get(p);
        tr.appendChild(c.cell ? c.cell(p, v) : el("td", { cls: (c.mono ? "mono " : "") + (c.wrap ? "wrap" : ""), text: String(v) }));
      });
      tr.addEventListener("click", function () { select(p, true); });
      p._row = tr;
      frag.appendChild(tr);
    });
    body.textContent = "";
    body.appendChild(frag);
    document.getElementById("empty").hidden = list.length > 0;
    document.getElementById("count").textContent = list.length + " of " + DATA.parts.length + " parts";
  }

  // ---- chips and column chooser ----
  (function chips() {
    var box = document.getElementById("chips");
    DATA.categories.forEach(function (c) {
      var b = el("button", { cls: "chip", type: "button", "aria-pressed": "false" }, [c.title.replace(/_/g, " "), el("span", { cls: "n", text: String(c.count) })]);
      b.addEventListener("click", function () {
        cats[c.key] = !cats[c.key];
        b.setAttribute("aria-pressed", String(!!cats[c.key]));
        renderRows();
      });
      box.appendChild(b);
    });
  })();
  (function colChooser() {
    var btn = document.getElementById("colbtn"), menu = document.getElementById("colmenu");
    COLS.forEach(function (c) {
      if (c.fixed) return;
      var box = el("input", { type: "checkbox" });
      box.checked = shown[c.id];
      box.addEventListener("change", function () { shown[c.id] = box.checked; saveCols(); renderHead(); renderRows(); });
      menu.appendChild(el("label", {}, [box, " " + c.label]));
    });
    btn.addEventListener("click", function (e) {
      menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); e.stopPropagation();
    });
    document.addEventListener("click", function (e) {
      if (!menu.hidden && !menu.contains(e.target)) { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    });
  })();

  // ---- detail panel ----
  function copyText(text, button) {
    function done(ok) { var t = button.textContent; button.textContent = ok ? "Copied" : "Copy failed"; setTimeout(function () { button.textContent = t; }, 1200); }
    function fallback() {
      var ta = el("textarea", { readonly: "", style: "position:fixed;left:-9999px;top:0" });
      ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    else fallback();
  }
  function preview(paths, what) {
    if (!paths.length) return [el("div", { cls: "card" }, [el("span", { cls: "none", text: DATA.previews ? "no " + what + " preview" : "previews off" })])];
    return paths.map(function (path) {
      var img = el("img", { src: relUrl(path), alt: what + " preview" });
      var card = el("div", { cls: "card" }, [img]);
      img.addEventListener("error", function () { card.textContent = ""; card.appendChild(el("span", { cls: "none", text: "no " + what + " preview" })); });
      return card;
    });
  }
  function select(p, updateHash) {
    if (selected && selected._row) selected._row.setAttribute("aria-selected", "false");
    selected = p;
    if (p._row) p._row.setAttribute("aria-selected", "true");
    var d = document.getElementById("detail");
    d.textContent = "";
    var tags = [p.jlc_type ? el("span", { cls: "tag " + p.jlc_type, text: p.jlc_type }) : null,
      p.status === "deprecated" ? el("span", { cls: "tag dep", text: "deprecated" }) : null,
      el("span", { cls: "tag", text: catTitle[p.category] || p.category })];
    d.appendChild(el("h2", { text: p.name }));
    d.appendChild(el("div", { cls: "muted", text: p.description }));
    d.appendChild(el("div", { cls: "links", style: "margin-top:6px" }, tags));
    d.appendChild(el("div", { cls: "previews" }, preview(p.sym_svgs, "symbol").concat(preview(p.fp_svg ? [p.fp_svg] : [], "footprint"))));

    var links = [];
    if (p.datasheet) links.push(el("a", { href: p.datasheet, target: "_blank", rel: "noopener", text: "Datasheet" + (p.datasheet_lang ? " (" + p.datasheet_lang + ")" : "") }));
    if (p.lcsc) {
      links.push(el("a", { href: "https://www.lcsc.com/product-detail/" + encodeURIComponent(p.lcsc) + ".html", target: "_blank", rel: "noopener", text: "LCSC" }));
      links.push(el("a", { href: "https://jlcpcb.com/parts/componentSearch?searchTxt=" + encodeURIComponent(p.lcsc), target: "_blank", rel: "noopener", text: "JLC" }));
    }
    if (p.mpn) { var b1 = el("button", { type: "button", text: "Copy MPN" }); b1.addEventListener("click", function () { copyText(p.mpn, b1); }); links.push(b1); }
    if (p.lcsc) { var b2 = el("button", { type: "button", text: "Copy LCSC" }); b2.addEventListener("click", function () { copyText(p.lcsc, b2); }); links.push(b2); }
    if (links.length) { d.appendChild(el("h3", { text: "Links" })); d.appendChild(el("div", { cls: "links" }, links)); }

    d.appendChild(el("h3", { text: "Check results" }));
    var iss = allIssues(p), old = STALE ? checkIssues(p.name) : [];
    function list(items) { return el("ul", { cls: "issues" }, items.map(function (i) { return el("li", { cls: i.severity, text: i.message }); })); }
    if (!CHECK || STALE) d.appendChild(el("div", { cls: "muted", text: (CHECK ? "check results are older than the data — run libkit check" : "not checked — run libkit check") + (p.issues.length ? "; build found:" : "") }));
    if (iss.length) d.appendChild(list(iss));
    else if (CHECK && !STALE) d.appendChild(el("div", { cls: "muted", text: "no findings" }));
    if (old.length) { d.appendChild(el("div", { cls: "muted", text: "last check (stale):" })); d.appendChild(list(old)); }

    d.appendChild(el("h3", { text: "Fields" }));
    var dl = el("dl");
    p.fields.forEach(function (f) { dl.appendChild(el("dt", { text: f[0] })); dl.appendChild(el("dd", { text: f[1] })); });
    dl.appendChild(el("dt", { text: "Keywords" })); dl.appendChild(el("dd", { text: p.keywords || "—" }));
    d.appendChild(dl);
    if (updateHash) {
      try { history.replaceState(null, "", "#" + encodeURIComponent(p.name)); } catch (e) { /* file:// in some browsers */ }
    }
  }

  // ---- wiring ----
  q.addEventListener("input", renderRows);
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") { q.value = ""; renderRows(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  function fromHash() {
    var name = decodeURIComponent(location.hash.slice(1));
    var p = DATA.parts.filter(function (x) { return x.name === name; })[0];
    if (p) { select(p, false); if (p._row) p._row.scrollIntoView({ block: "center" }); }
  }
  window.addEventListener("hashchange", fromHash);
  renderHead();
  renderRows();
  fromHash();
  q.focus();
})();
</script>
</body>
</html>
