# KLC rules deliberately not enforced. Each entry: kind (symbol|footprint),
# item (name glob or list of globs; symbols are "<Lib>:<Symbol>"), rule, reason.

# --- Footprints -----------------------------------------------------------
- kind: footprint
  item: "*"
  rule: F9.3
  reason: >-
    F9.3 expects the official ${KICAD10_3DMODEL_DIR}/<Lib>.3dshapes layout.
    LIB uses ${LIB_DIR}/3dmodels/<Lib>.3dshapes (spec 6.3); libkit check
    verifies every model path and file instead.
- kind: footprint
  item: "[RCL]_0[46]0[23]_*Metric"
  rule: F5.2
  reason: >-
    0402/0603 chip footprints copied unchanged from KiCad's stock library;
    the fab-layer RefDes is scaled below 0.5 mm to fit the body.

# --- Symbols --------------------------------------------------------------
- kind: symbol
  item: "*"
  rule: S6.2
  reason: >-
    Every LIB symbol is one orderable part: Value is the component value, not
    the symbol name, and it carries extra fields (Manufacturer, MPN, LCSC,
    JLC_Type, parameters). Required fields are enforced by the schema instead.
- kind: symbol
  item: "*"
  rule: S5.1
  reason: >-
    Parts carry a fixed Footprint instead of footprint filters; libkit check
    verifies that every footprint exists.
- kind: symbol
  item: "*"
  rule: S5.2
  reason: Parts use a fixed Footprint, not footprint filters (see S5.1).
- kind: symbol
  item: &stock_bases ["*:R", "*:C", "*:C_Polarized", "*:L", "*:FerriteBead"]
  rule: S3.3
  reason: Base symbol copied unchanged from KiCad's Device library (no body fill).
- kind: symbol
  item: *stock_bases
  rule: S3.6
  reason: Base symbol copied unchanged from KiCad's Device library (pin name offset).
- kind: symbol
  item: *stock_bases
  rule: S4.1
  reason: >-
    Base passive symbols from KiCad's Device library use 110 mil, unnamed
    pins; kept unchanged so they match KiCad's stock look.

# --- Stock KiCad content vendored unchanged (Plan 4 starter set, user OK 2026-11-01) ---
- kind: footprint
  item: ["D_SOD-123", "D_SOD-323", "D_SMA", "D_SMB", "SOT-23", "LED_0[46]0[358]_*Metric", "MountingHole_*", "TestPoint_*", "Fiducial_*"]
  rule: F9.1
  reason: >-
    Stock KiCad footprint copied unchanged; generic packages carry no datasheet
    URL in their description (the part's datasheet is on the symbol).
- kind: footprint
  item: "LED_0[46]0[23]_*Metric"
  rule: F5.2
  reason: Stock KiCad LED footprint copied unchanged; fab RefDes scaled below 0.5 mm to fit the body.
- kind: footprint
  item: "MountingHole_*_Pad*"
  rule: F7.1
  reason: >-
    Stock KiCad mounting hole copied unchanged; plated hole that is deliberately
    excluded from BOM and position files.
- kind: footprint
  item: ["TestPoint_Pad_*", "Fiducial_*"]
  rule: F6.3
  reason: Stock KiCad footprint copied unchanged; test pads and fiducials have no paste on purpose.
- kind: footprint
  item: "Fiducial_*"
  rule: F6.1
  reason: Stock KiCad fiducial copied unchanged; a fiducial is an SMD feature without soldered pads.
- kind: symbol
  item: ["*:MountingHole", "*:Fiducial"]
  rule: S7.2
  reason: Stock KiCad graphical base symbol copied unchanged (keeps KiCad's footprint filters).
- kind: symbol
  item: ["*:MountingHole", "*:BAT54C*"]
  rule: S3.6
  reason: Stock KiCad symbol copied unchanged (pin name offset).
- kind: symbol
  item: ["*:MountingHole_Pad", "*:BAT54C*", "*:BAV99*"]
  rule: S3.1
  reason: Stock KiCad symbol copied unchanged (origin not centred).
- kind: symbol
  item: ["LIB_Mechanical:Fiducial*"]
  rule: S6.1
  reason: KiCad's stock fiducial uses reference FID, which the KLC list does not include.
- kind: symbol
  item: ["*:BAT54C*"]
  rule: S4.1
  reason: Stock KiCad dual-diode symbol copied unchanged (unnamed common pin).
- kind: symbol
  item: ["*:LED", "*:BAV99*"]
  rule: EC01
  reason: Stock KiCad symbol copied unchanged (extended geometry check only).
