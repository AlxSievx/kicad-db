[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libkit"
version = "0.1.0"
description = "Build and check tooling for the LIB KiCad part library"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kicad: needs kicad-cli"]
